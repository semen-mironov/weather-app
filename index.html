<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather app</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <input type="text" placeholder="city">

        <div class="date">
        </div>
        <p class="weather"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
